{% extends "base.html" %}

{% block title %}Удалить клиента — MailHub{% endblock %}

{% block content %}
<div class="max-w-lg">
    <div class="rounded-xl border border-red-200 bg-red-50 p-6">
        <h1 class="text-xl font-semibold text-red-700 mb-2">Удалить получателя?</h1>
        <p class="text-slate-700 mb-6">
            Вы уверены, что хотите удалить <strong>{{ object.full_name }}</strong> ({{ object.email }})?
            Это действие необратимо.
        </p>
        <form method="post" class="flex gap-3">
            {% csrf_token %}
            <button type="submit" class="rounded-lg bg-red-600 text-white px-4 py-2 text-sm font-medium hover:bg-red-700">
                Да, удалить
            </button>
            <a href="{% url 'clients:client_list' %}" class="rounded-lg bg-slate-100 px-4 py-2 text-sm font-medium hover:bg-slate-200">
                Отмена
            </a>
        </form>
    </div>
</div>
{% endblock %}
