{% extends "base.html" %}

{% block title %}{{ message_obj.subject }} — MailHub{% endblock %}

{% block content %}
<div class="max-w-2xl">
    <a href="{% url 'messages_app:message_list' %}" class="text-sm text-sky-600 hover:underline">&larr; К списку сообщений</a>

    <div class="mt-4 rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
        <h1 class="text-2xl font-semibold mb-4">{{ message_obj.subject }}</h1>
        <div class="prose max-w-none whitespace-pre-line text-slate-800">{{ message_obj.body }}</div>

        <p class="text-xs text-slate-400 mt-6">Создано: {{ message_obj.created_at }}</p>

        <div class="mt-6 flex gap-3">
            <a href="{% url 'messages_app:message_update' message_obj.pk %}"
               class="rounded-lg bg-slate-100 px-4 py-2 text-sm font-medium hover:bg-slate-200">Изменить</a>
            <a href="{% url 'messages_app:message_delete' message_obj.pk %}"
               class="rounded-lg bg-red-50 text-red-600 px-4 py-2 text-sm font-medium hover:bg-red-100">Удалить</a>
        </div>
    </div>
</div>
{% endblock %}
