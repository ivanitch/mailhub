{% extends "base.html" %}
{% block title %}Вход — {{ APP_NAME }}{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
    <h1 class="text-2xl font-semibold mb-6">Вход</h1>
    <form method="post" class="space-y-4 rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
        {% csrf_token %}
        {% include "_form_fields.html" %}
        <button type="submit" class="w-full rounded-lg bg-sky-600 text-white px-4 py-2 text-sm font-medium hover:bg-sky-700">
            Войти
        </button>
    </form>
    <div class="mt-4 flex justify-between text-sm">
        <a href="{% url 'users:register' %}" class="text-sky-600 hover:underline">Зарегистрироваться</a>
        <a href="{% url 'users:password_reset' %}" class="text-slate-500 hover:underline">Забыли пароль?</a>
    </div>
</div>
{% endblock %}
